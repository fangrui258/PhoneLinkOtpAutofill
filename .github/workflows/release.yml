name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Resolve release metadata
        shell: pwsh
        run: |
          $version = python -c "from release_metadata import VERSION; print(VERSION)"
          $exeName = python -c "from release_metadata import EXECUTABLE_NAME; print(EXECUTABLE_NAME)"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXE_NAME=$exeName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify source and parser
        shell: pwsh
        run: |
          python -m py_compile PhoneLinkOtpAutofill.py release_metadata.py test_parser.py test_phone_link_window.py test_otp_cooldown.py test_history_guard.py test_version_info.py test_release_metadata.py
          python test_parser.py
          python test_phone_link_window.py
          python test_otp_cooldown.py
          python test_history_guard.py
          python test_version_info.py
          python test_release_metadata.py

      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $expectedTag = "v$env:APP_VERSION"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag ${{ github.ref_name }} does not match app version $expectedTag"
          }

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            PhoneLinkOtpAutofill.spec

      - name: Smoke-test executable
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath "dist\$env:EXE_NAME" `
            -ArgumentList "--smoke-test" `
            -WindowStyle Hidden `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Executable smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash `
            -Algorithm SHA256 `
            "dist\$env:EXE_NAME"

          "$($hash.Hash.ToLower())  $env:EXE_NAME" |
            Set-Content `
              -Encoding ascii `
              dist\SHA256SUMS.txt

      - name: Store manual build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: PhoneLinkOtpAutofill-v${{ env.APP_VERSION }}-win-x64
          path: |
            dist/${{ env.EXE_NAME }}
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseNotes = @"
          Version: ${{ github.ref_name }}
          Platform: Windows 10/11 x64
          Package: Self-contained EXE; Python and Anaconda are not required.
          "@

          gh release create "${{ github.ref_name }}" `
            "dist/$env:EXE_NAME" `
            "dist/SHA256SUMS.txt" `
            --verify-tag `
            --generate-notes `
            --notes $releaseNotes `
            --title "Phone Link OTP Autofill ${{ github.ref_name }}"
